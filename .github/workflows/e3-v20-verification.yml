name: E3 V50 Verification

on:
  push:
    branches: [production-v2]
  workflow_dispatch:

jobs:
  e3-v50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Compile E3
        run: python -m py_compile production_v2/e3_brain.py
      - name: Run isolated E3 V50 regression tests
        run: python -m pytest -q production_v2/test_e3_brain.py
