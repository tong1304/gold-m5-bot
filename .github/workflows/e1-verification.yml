name: E1 verification
on:
  push:
    branches: [production-v2]
  workflow_dispatch:

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  e1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q production_v2
      - run: python -m pytest -q tests/test_e1_professional_regime_reconciliation.py
