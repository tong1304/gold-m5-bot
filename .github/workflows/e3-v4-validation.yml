name: E3 V4 validation

on:
  push:
    branches: [production-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile E3
        run: python -m py_compile production_v2/e3_brain.py
      - name: Run E3 regression suite
        run: python -m pytest -q tests/test_e3_professional_brain.py tests/test_e3_single_brain.py tests/test_e3_professional_v4_regressions.py
