name: fix M15 neutral diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact MTF gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('live_scanner.py')
          s = p.read_text(encoding='utf-8')

          old = '''        if pattern_signal and m15["bias"] != pattern_signal:\n            reasons.append(f"M15_MISMATCH:{m15['bias']}")'''
          new = '''        if pattern_signal and m15["bias"] in ("BUY", "SELL") and m15["bias"] != pattern_signal:\n            reasons.append(f"M15_MISMATCH:{m15['bias']}")'''

          assert old in s, 'M15 diagnostic block not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile live_scanner.py

          python - <<'PY'
          from pathlib import Path
          s = Path('live_scanner.py').read_text(encoding='utf-8')
          expected = 'if pattern_signal and m15["bias"] in ("BUY", "SELL") and m15["bias"] != pattern_signal:'
          assert expected in s, 'M15 neutral-safe gate missing'
          print('M5 single-pattern + M15 neutral-safe policy: PASS')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix_m15_neutral.yml
          git add live_scanner.py .github/workflows/fix_m15_neutral.yml
          git commit -m 'Fix M15 neutral mismatch gate' || exit 0
          git push