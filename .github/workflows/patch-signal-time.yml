name: Patch signal time to Bangkok

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live_scanner.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('live_scanner.py')
          s = p.read_text(encoding='utf-8')
          old_import = 'from datetime import datetime, timezone\n'
          new_import = 'from datetime import datetime, timezone\nfrom zoneinfo import ZoneInfo\n'
          if 'from zoneinfo import ZoneInfo' not in s:
              s = s.replace(old_import, new_import, 1)
          marker = 'BINANCE = BinanceMarketData()\n'
          helper = '''BINANCE = BinanceMarketData()\nBANGKOK = ZoneInfo("Asia/Bangkok")\n\n\ndef _format_candle_time_bangkok(value):\n    try:\n        text = str(value).strip()\n        if text.endswith("Z"):\n            text = text[:-1] + "+00:00"\n        dt = datetime.fromisoformat(text)\n        if dt.tzinfo is None:\n            dt = dt.replace(tzinfo=timezone.utc)\n        return dt.astimezone(BANGKOK).strftime("%d/%m/%Y %H:%M:%S") + " (กรุงเทพฯ)"\n    except (TypeError, ValueError, OverflowError):\n        return str(value)\n'''
          if '_format_candle_time_bangkok' not in s:
              s = s.replace(marker, helper, 1)
          old = 'f"🕯 <b>แท่งที่ใช้วิเคราะห์:</b> {candle_time}\\n"'
          new = 'f"🕯 <b>แท่งที่ใช้วิเคราะห์:</b> {_format_candle_time_bangkok(candle_time)}\\n"'
          if old not in s:
              raise SystemExit('target formatter line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_scanner.py
          git diff --cached --quiet || git commit -m 'fix: display signal candle time in Bangkok timezone'
          git push