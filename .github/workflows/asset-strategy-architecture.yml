name: Asset Strategy Architecture Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile changed strategy modules
        env:
          PYTHONPATH: .
        run: python -m py_compile v11/strategy_scoring.py v11/asset_strategies.py v11/regime.py v11/engine.py v11/engine_gold.py
      - name: Run asset strategy architecture tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_asset_strategy_architecture.py
