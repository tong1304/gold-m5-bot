name: e4-surgery-validation
on:
  push:
    branches: [e4-professional-surgery]
  pull_request:
    branches: [e4-professional-surgery]

jobs:
  e4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m compileall -q production_v2/e4_brain.py
      - run: python -m pytest -q tests/test_e4_surgery_v19.py
