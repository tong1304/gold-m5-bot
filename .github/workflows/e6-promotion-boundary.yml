name: E6 promotion boundary

on:
  push:
    branches: [production-v2]

jobs:
  promote-only-with-complete-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v2

      - name: Patch E6 promotion boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("production_v2/e6_pending_event_surgery.py")
          s = p.read_text()

          old = '''def _generic_candidate(upstream: dict[str, EngineResult]) -> dict[str, Any] | None:\n    e1, e2, e3, e4, e5 = (_payload(upstream, key) for key in ("E1", "E2", "E3", "E4", "E5"))\n    if _is_invalidated(e3) or not _pending_event(e4):\n        return None\n'''
          new = '''def _generic_candidate(upstream: dict[str, EngineResult]) -> dict[str, Any] | None:\n    e1, e2, e3, e4, e5 = (_payload(upstream, key) for key in ("E1", "E2", "E3", "E4", "E5"))\n    if _is_invalidated(e3):\n        return None\n    event = _text(e4.get("event") or e4.get("finding"))\n    if not any(token in event for token in MEANINGFUL_EVENTS):\n        return None\n'''
          if old not in s:
              raise SystemExit("candidate boundary not found")
          s = s.replace(old, new, 1)

          old = '''    continuation_risk = "CONTINUATION_RISK" in finding5 or ("ACCEPTED" in finding5 and "REVERSAL" in finding5)\n    structure_support, structure_counter = _structure_evidence(e3, direction)\n'''
          new = '''    continuation_risk = "CONTINUATION_RISK" in finding5 or ("ACCEPTED" in finding5 and "REVERSAL" in finding5)\n    value = _text(e5.get("value_state"))\n    structural_location = _text(e5.get("structural_location"))\n    favorable_location = "FAVORABLE_LOCATION" in finding5 or value in {"DISCOUNT", "PREMIUM", "EQUILIBRIUM"} or structural_location in {"AT_SUPPORT", "AT_RESISTANCE"}\n    structure_support, structure_counter = _structure_evidence(e3, direction)\n'''
          if old not in s:
              raise SystemExit("location boundary not found")
          s = s.replace(old, new, 1)

          old = '''    if _text(e4.get("auction_state")) in PENDING_AUCTION_STATES:\n        counter.append("E4_AUCTION_UNCONFIRMED")\n    else:\n        support.append("E4_CONFIRMED_RESPONSE")\n    missing = ["E4_AUCTION_FOLLOW_THROUGH", "E7_CONFIRMATION"]\n'''
          new = '''    auction_state = _text(e4.get("auction_state") or e4.get("auction_phase") or e4.get("state"))\n    if auction_state in PENDING_AUCTION_STATES:\n        counter.append("E4_AUCTION_UNCONFIRMED")\n    else:\n        support.append("E4_CONFIRMED_RESPONSE")\n    missing = ["E7_CONFIRMATION"]\n    if auction_state in PENDING_AUCTION_STATES:\n        missing.insert(0, "E4_AUCTION_FOLLOW_THROUGH")\n'''
          if old not in s:
              raise SystemExit("auction boundary not found")
          s = s.replace(old, new, 1)

          old = '''    return {"direction": direction, "family": "LIQUIDITY_RESPONSE", "event_id": str(e4.get("event_id") or e4.get("event_candle_id") or ""), "space": round(space, 4), "support": list(dict.fromkeys(support)), "counter": list(dict.fromkeys(counter)), "missing": list(dict.fromkeys(missing)), "direction_source": "E4_EVENT" if event_direction in DIRECTIONS else "UPSTREAM_FALLBACK"}\n\n\ndef _candidate'''
          new = '''    return {"direction": direction, "family": "LIQUIDITY_RESPONSE", "event_id": str(e4.get("event_id") or e4.get("event_candle_id") or ""), "space": round(space, 4), "support": list(dict.fromkeys(support)), "counter": list(dict.fromkeys(counter)), "missing": list(dict.fromkeys(missing)), "favorable_location": favorable_location, "direction_source": "E4_EVENT" if event_direction in DIRECTIONS else "UPSTREAM_FALLBACK"}\n\n\ndef _promotion_ready(candidate: dict[str, Any]) -> bool:\n    missing = set(candidate.get("missing") or [])\n    blockers = {"E2_OPPORTUNITY_CONFIRMATION", "E4_AUCTION_FOLLOW_THROUGH", "E3_INTERNAL_STRUCTURE_ALIGNMENT", "STRUCTURAL_SPACE_INSUFFICIENT", "E5_DIRECTIONAL_LOCATION_CONFLICT"}\n    if missing & blockers:\n        return False\n    if candidate.get("space", 0.0) < MIN_SPACE_ATR or not candidate.get("favorable_location"):\n        return False\n    required = {"E1_DIRECTIONAL_CORE", "E2_DIRECTIONAL_ANCHOR", "E3_INTERNAL_STRUCTURE_ALIGNMENT", "E4_CONFIRMED_RESPONSE"}\n    if not required.issubset(set(candidate.get("support") or [])):\n        return False\n    return not candidate.get("counter")\n\n\ndef _candidate'''
          if old not in s:
              raise SystemExit("promotion insertion point not found")
          s = s.replace(old, new, 1)

          old = '''        current = _out(result)\n        if _is_existing_watch(current) or not _is_no_setup(current):\n            return _canonicalize_watch_evidence(_normalize_space_consistency(result, upstream), upstream)\n        candidate = _candidate(upstream)\n        if candidate is None:\n'''
          new = '''        current = _out(result)\n        normalized = _canonicalize_watch_evidence(_normalize_space_consistency(result, upstream), upstream)\n        candidate = _candidate(upstream)\n        if _is_existing_watch(current) and candidate is not None and _promotion_ready(candidate):\n            out = dict(normalized.output or {})\n            event_id = candidate.get("event_id") or ""\n            out.update({\n                "architecture": VERSION, "state": "SETUP_THESIS", "setup_state": "SETUP_THESIS", "opportunity_stage": "SETUP_THESIS",\n                "setup": candidate["family"], "setup_family": candidate["family"], "candidate_type": "SETUP_CANDIDATE",\n                "direction": candidate["direction"], "direction_thesis": candidate["direction"], "thesis_direction": candidate["direction"], "thesis_status": "FORMING",\n                "setup_exists": True, "watch_only": False, "trade_ready": False, "trade_permission": False, "gate_passed": False,\n                "finding": f"{candidate['direction']} causal setup thesis is established from complete closed-candle E1-E5 evidence; E7 confirmation and E8 economics remain pending.",\n                "thesis": f"{candidate['direction']} setup thesis: {candidate['family']} supported by complete closed-candle upstream evidence.",\n                "supporting_evidence": list(dict.fromkeys(candidate["support"])), "counter_evidence": [], "hard_conflicts": [],\n                "missing_proof": ["E7_CONFIRMATION"], "missing_evidence": ["E7_CONFIRMATION"], "next_required_event": "E7_CONFIRMATION", "wait_for": "E7_CONFIRMATION",\n                "candidate_identity": f"SETUP_THESIS:{candidate['direction']}:{candidate['family']}:{event_id}", "opportunity_id": f"{candidate['direction']}|SETUP_THESIS|{event_id}" if event_id else f"{candidate['direction']}|SETUP_THESIS",\n                "event_id": event_id, "available_space_atr": candidate["space"], "reason_codes": ["E7_CONFIRMATION"], "reasons": ["E7_CONFIRMATION"],\n                "execution_authority": "E9", "e6_causal_gate": "PASSED", "e6_thesis_proven": True, "invalidated": False,\n                "upstream_evidence_lost": False, "causal_evidence_lost": False, "lifecycle_state": "SETUP_THESIS", "promotion_authority": "E6_COMPLETE_UPSTREAM_EVIDENCE"\n            })\n            print(f"[PRODUCTION V2] E6_PENDING_EVENT_SURGERY version={VERSION} action=PROMOTE_SETUP_THESIS direction={candidate['direction']} event_id={event_id}", flush=True)\n            return EngineResult("E6", "Setup Brain", False, normalized.score, out, ("E7_CONFIRMATION",))\n        if _is_existing_watch(current) or not _is_no_setup(current):\n            return normalized\n        if candidate is None:\n'''
          if old not in s:
              raise SystemExit("install promotion boundary not found")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Run focused E6 regression tests
        run: |
          python -m pip install -q pytest
          pytest -q production_v2/test_e6_promotion_path.py production_v2/test_e6_evidence_authority.py

      - name: Commit only after tests pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production_v2/e6_pending_event_surgery.py
          git commit -m 'fix: prove E6 watch to setup promotion path'
          git push origin production-v2
