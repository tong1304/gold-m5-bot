name: e9-surgery-focused
on:
  push:
    branches: [production-v2]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  e9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - run: python -m pytest -q tests/test_e9_master_authority.py
