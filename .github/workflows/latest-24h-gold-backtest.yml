name: Latest 24h GOLD M5 Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_latest_24h_backtest.py'
      - 'tests/test_latest_24h_backtest.py'
      - '.github/workflows/latest-24h-gold-backtest.yml'

permissions:
  contents: write

concurrency:
  group: latest-24h-gold-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q tests/test_latest_24h_backtest.py
      - name: Run latest 24h real GOLD backtest
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
        run: |
          test -n "$LSE_API_KEY"
          python scripts/run_latest_24h_backtest.py
      - name: Validate result
        run: |
          test -s latest_24h_gold_backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('latest_24h_gold_backtest.json').read_text())
          assert p['status'] == 'completed', p
          assert p['symbol'] == 'GOLD', p
          assert p['market'] == 'XAU/USD', p
          assert p['duration_hours'] == 24, p
          assert p['lookahead_safe'] is True, p
          assert p['data_quality']['target_m5_rows'] > 0, p
          assert p['summary']['candles_evaluated'] > 0, p
          print('LATEST 24H GOLD BACKTEST VALIDATED')
          print(json.dumps(p['summary'], ensure_ascii=False, indent=2))
          print(json.dumps(p['data_quality'], ensure_ascii=False, indent=2))
          PY
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-24h-gold-m5-backtest
          path: latest_24h_gold_backtest.json
          if-no-files-found: error
      - name: Persist result on production-v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_24h_gold_backtest.json
          if git diff --cached --quiet; then
            echo "latest_24h_gold_backtest.json unchanged"
          else
            git commit -m "data: persist latest 24h GOLD backtest"
            git push origin HEAD:production-v2
          fi
