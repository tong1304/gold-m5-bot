name: e4-surgery-red
on:
  pull_request:
    branches: [production-v2]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_e4_professional_surgery.py
