name: p0-surgery-verify
on:
  push:
    branches: [p0-opportunity-integrity-surgery-4]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q production_v2
      - run: python -m pytest -q tests/test_p0_opportunity_integrity.py tests/test_opportunity_lifecycle_timing.py tests/test_lifecycle_promotion_boundary.py
