name: production-v2-coherence

on:
  push:
    branches: [production-v2]
  workflow_dispatch:

jobs:
  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Runtime binding regression
        env:
          PRODUCTION_V2_DISABLE_LIVE: '1'
        run: python -m pytest -q production_v2/test_runtime_binding_order_regression.py
