name: Legacy V5 Validation (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile legacy Python files
        run: python -m py_compile engine_v42.py engine_v5.py pattern_engine.py live_scanner.py live_price.py
      - name: Run legacy regression tests
        run: pytest -q tests
