name: v5 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m py_compile app.py engine_v42.py engine_v5.py pattern_engine.py live_scanner.py live_price.py
      - name: Run regression tests
        run: pytest -q tests
