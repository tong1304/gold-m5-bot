name: Verify production-v2 professional opportunity layer

on:
  push:
    paths:
      - 'production_v2/**'
      - 'requirements.txt'
      - '.github/workflows/verify-production-v2.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production-v2 dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run professional opportunity tests
        run: python -m pytest -q production_v2/test_professional_opportunity.py
      - name: Run opportunity lifecycle tests
        run: python -m pytest -q production_v2/test_opportunity_lifecycle.py
      - name: Run opportunity lifecycle continuity tests
        run: python -m pytest -q production_v2/test_opportunity_lifecycle_continuity.py
      - name: Run E6 event direction and identity regression tests
        run: python -m pytest -q production_v2/test_e6_event_direction.py
      - name: Run E9 watch semantics tests
        run: python -m pytest -q production_v2/test_e9_watch_semantics.py
      - name: Run E4 lifecycle surgery tests
        run: python -m pytest -q production_v2/test_e4_event_lifecycle_surgery.py
      - name: Run E4 nested event-age regression test
        run: python -m pytest -q production_v2/test_e4_nested_age_regression.py
      - name: Run durable opportunity memory tests
        run: python -m pytest -q production_v2/test_opportunity_memory.py
      - name: Compile production-v2 Python modules
        run: python -m compileall -q production_v2
