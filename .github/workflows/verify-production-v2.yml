name: Verify production-v2 professional opportunity layer

on:
  push:
    paths:
      - 'production_v2/**'
      - 'requirements.txt'
      - '.github/workflows/verify-production-v2.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production-v2 dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run professional opportunity tests
        run: python -m pytest -q production_v2/test_professional_opportunity.py
      - name: Run opportunity lifecycle tests
        run: python -m pytest -q production_v2/test_opportunity_lifecycle.py
      - name: Compile production-v2 Python modules
        run: python -m compileall -q production_v2
