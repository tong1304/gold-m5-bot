name: Opportunity Memory E2E Tests

on:
  push:
    branches: [production-v2]
  workflow_dispatch:

jobs:
  opportunity-memory-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run terminal opportunity tests
        run: python -m pytest -q production_v2/test_terminal_opportunity_runtime.py production_v2/test_opportunity_memory_terminal.py production_v2/test_opportunity_memory_restart.py
