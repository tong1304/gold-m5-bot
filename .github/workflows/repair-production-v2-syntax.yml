name: repair-production-v2-syntax

on:
  push:
    branches: [production-v2]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v2
          fetch-depth: 0
      - name: Repair malformed lifecycle dict
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('production_v2/pipeline.py')
          s = p.read_text(encoding='utf-8')
          old = 'previous_directional = {"opportunities": {str(previous_lifecycle["direction"]): previous_lifecycle}'
          new = 'previous_directional = {"opportunities": {str(previous_lifecycle["direction"]): previous_lifecycle}}'
          if old not in s:
              raise SystemExit('expected malformed lifecycle expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile production_v2/pipeline.py
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-production-v2-syntax.yml
          git add production_v2/pipeline.py .github/workflows/repair-production-v2-syntax.yml
          git commit -m 'fix(production-v2): close malformed lifecycle dictionary'
          git push origin HEAD:production-v2
