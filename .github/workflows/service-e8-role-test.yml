name: service-e8-role-test
on:
  push:
    branches: [production-v2]

jobs:
  test-service-e8-role:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Run E8 runtime role regression
        run: python -m pytest -q tests/test_service_e8_role.py
