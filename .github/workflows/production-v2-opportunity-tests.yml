name: Production V2 Opportunity Tests

on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [production-v2]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q production_v2/test_opportunity_execution.py
