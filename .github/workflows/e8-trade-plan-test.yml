name: e8-trade-plan-test
on:
  push:
    branches: [production-v2]

jobs:
  test-e8-trade-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Compile E8
        run: python -m compileall -q trading_system
      - name: Run E8 trade plan test
        run: python -m pytest -q tests/test_e8_trade_plan.py
      - name: Run E8-to-E9 boundary regression test
        run: python -m pytest -q tests/test_e8_engine_boundary.py
      - name: Run production-v2 lifecycle regression tests
        run: python -m pytest -q production_v2/test_opportunity_lifecycle_continuity.py production_v2/test_e6_space_consistency.py
