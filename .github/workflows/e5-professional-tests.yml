name: E5 Professional Location Tests
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [main, production-v2]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  e5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile E5
        run: python -m py_compile production_v2/e5_brain.py
      - name: Run E5 professional location regression tests
        run: python -m pytest -q tests/test_e5_location_professional.py
