name: E6 Lifecycle V10 Regression

on:
  push:
    branches: [production-v2]
  workflow_dispatch:

jobs:
  e6-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q pytest
      - name: Run E6 and lifecycle regressions
        run: pytest -q tests/test_e6_opportunity_lifecycle_regression.py tests/test_opportunity_lifecycle_v10.py
