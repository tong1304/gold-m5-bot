name: E9 Surgery Regression

on:
  push:
    branches: [surgery/e9-governance-opportunity]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: pytest -q production_v2/test_e9_market_control_regression.py production_v2/test_e9_governance_regression.py
