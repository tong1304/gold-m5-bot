name: Opportunity Intelligence Regression

on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [production-v2]

jobs:
  opportunity-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile opportunity intelligence
        run: python -m py_compile production_v2/professional_opportunity.py production_v2/opportunity_lifecycle.py
      - name: Run opportunity intelligence tests
        run: python -m pytest -q production_v2/test_professional_opportunity_core.py production_v2/test_opportunity_lifecycle_regression.py
