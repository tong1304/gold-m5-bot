name: Opportunity Timing Integration

on:
  push:
    branches: [production-v2]
    paths:
      - 'production_v2/opportunity_timing.py'
      - 'production_v2/professional_opportunity_surgery.py'
      - 'production_v2/__init__.py'
      - 'tests/test_opportunity_timing.py'
      - '.github/workflows/opportunity-timing-integration.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production-v2

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused timing tests
        run: python -m pytest -q tests/test_opportunity_timing.py

      - name: Verify production bootstrap syntax
        run: python -m compileall -q production_v2

      - name: Verify timing integration and E9 authority
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          from production_v2.opportunity_timing import classify_opportunity_timing
          from production_v2 import professional_opportunity_surgery

          timing = classify_opportunity_timing({
              'direction':'BUY', 'event':'LOW_SWEEP_REJECTION', 'event_age_bars':1,
              'confidence':0.70, 'available_space_atr':2.4697,
              'event_level':4411.83, 'price':4411.78, 'event_atr_frozen':5.549286,
              'auction_state':'PENDING'
          })
          assert timing['phase'] == 'EARLY_OPPORTUNITY'
          assert timing['decision_speed'] == 'FAST'
          assert timing['execution_authority'] == 'E9_ONLY'

          class FakeModule:
              def consolidate(self, results):
                  return {'state':'OPPORTUNITY_WATCH','trade_authorized':False}

          module = FakeModule()
          professional_opportunity_surgery.install(module)
          result = module.consolidate({
              'E4': SimpleNamespace(output={'direction':'BUY','event':'LOW_SWEEP_REJECTION','event_age_bars':1,'quality':70.0,'event_level':4411.83,'event_atr_frozen':5.549286,'auction_state':'PENDING'}),
              'E5': SimpleNamespace(output={'price':4411.78,'available_space_atr_long':2.4697,'available_space_atr_short':0.8415}),
              'E6': SimpleNamespace(output={'direction':'BUY','setup':'OPPORTUNITY_WATCH','trade_ready':False}),
          })
          assert result['opportunity_timing']['phase'] == 'EARLY_OPPORTUNITY'
          assert result['opportunity_timing']['decision_speed'] == 'FAST'
          assert result['trade_authorized'] is False
          print('TIMING_INTEGRATION_OK', result['opportunity_timing'])
          PY
