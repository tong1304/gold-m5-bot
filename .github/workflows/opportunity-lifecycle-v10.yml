name: opportunity-lifecycle-v10
on:
  push:
    branches: [repair/opportunity-lifecycle-v10]
  pull_request:
    branches: [production-v2]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pytest -q tests/test_e6_runtime_binding.py
      - run: python -m compileall -q production_v2
