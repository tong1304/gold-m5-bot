name: Surgery Structure Governance Verification

on:
  push:
    branches: [surgery-structure-governance-20260901]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Compile changed brains
        run: python -m py_compile production_v2/e3_brain.py production_v2/e9_brain.py
      - name: Run surgery regression tests
        run: PYTHONPATH=. python -m pytest -q production_v2/tests/test_structure_governance_surgery.py
