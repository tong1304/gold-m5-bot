name: V12 Architecture Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'v11/**'
      - 'tests/test_strategy_architecture.py'
      - 'tests/test_cross_asset_fallback.py'
      - 'tests/test_replay_m5_window.py'
      - 'tests/test_v12_regime_priority.py'
      - 'tests/test_h1_bias_gate.py'
      - 'tests/test_gold_g3_smc.py'
      - 'tests/test_btc_strategy_dispatch.py'
      - '.github/workflows/v12-architecture-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile V12 modules
        run: python -m py_compile v11/engine.py v11/engine_gold.py v11/regime.py v11/cross_asset_fallback.py v11/strategy_engine.py v11/btc_strategy_dispatch.py v11/setup_state.py v11/replay.py v11/replay_m5.py live_scanner_v11.py
      - name: Run architecture and V12 regression tests
        run: pytest -q tests/test_strategy_architecture.py tests/test_cross_asset_fallback.py tests/test_btc_strategy_dispatch.py tests/test_replay_m5_window.py tests/test_v12_regime_priority.py tests/test_h1_bias_gate.py tests/test_gold_g3_smc.py
