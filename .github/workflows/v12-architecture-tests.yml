name: V12 Architecture Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'v11/**'
      - 'tests/test_strategy_architecture.py'
      - '.github/workflows/v12-architecture-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile V12 modules
        run: python -m py_compile v11/engine.py v11/regime.py v11/strategy_engine.py v11/setup_state.py v11/replay.py live_scanner_v11.py
      - name: Run architecture tests
        run: pytest -q tests/test_strategy_architecture.py
