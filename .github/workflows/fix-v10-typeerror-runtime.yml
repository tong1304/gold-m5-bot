name: Fix E1 V10 EMA scalar runtime error

on:
  push:
    branches: [production-v2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production-v2
          fetch-depth: 0

      - name: Patch V10 EMA handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('production_v2/e1_professional_layer_v10.py')
          s = p.read_text()
          old = '        ema20s = _ema(closes, 20)\n        ema50s = _ema(closes, 50)\n        ema20, ema50 = ema20s[-1], ema50s[-1]\n'
          new = '        ema20 = _ema(closes, 20)\n        ema50 = _ema(closes, 50)\n'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify E1 V10 import and scalar EMA contract
        run: |
          python -m py_compile production_v2/e1_professional_layer_v10.py
          grep -n 'ema20 = _ema\|ema50 = _ema' production_v2/e1_professional_layer_v10.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production_v2/e1_professional_layer_v10.py
          git commit -m 'fix E1 V10 EMA scalar runtime TypeError'
          git push origin production-v2
