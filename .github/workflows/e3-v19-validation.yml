name: E3 v19 professional validation

on:
  push:
    branches: [production-v2]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  e3-v19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile E3
        run: python -m py_compile production_v2/e3_brain.py
      - name: Run E3 v19 regression tests
        run: python -m pytest -q tests/test_e3_professional_v19.py
