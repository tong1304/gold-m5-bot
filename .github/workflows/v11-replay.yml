name: V11 Replay (LSE)

on:
  push:
    paths:
      - '.github/workflows/v11-replay.yml'
      - 'v11/**'
      - 'replay_signal_history_v11.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      start:
        description: 'Bangkok start date YYYY-MM-DD'
        required: true
        default: '2026-08-01'
      end:
        description: 'Bangkok end date YYYY-MM-DD (inclusive)'
        required: true
        default: '2026-08-24'
      symbol:
        description: 'Asset'
        required: true
        type: choice
        options:
          - ALL
          - BTC
          - GOLD
        default: ALL
      dry_run:
        description: 'Do not write replay results to history'
        required: true
        type: boolean
        default: true

env:
  LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
  LSE_REPLAY_LIMIT: '5000'
  RISK_REWARD: '2.0'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate LSE secret
        run: |
          test -n "$LSE_API_KEY" || (echo 'LSE_API_KEY GitHub Actions secret is missing' >&2; exit 1)

      - name: Select replay parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
            echo "symbol=${{ inputs.symbol }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo 'start=2026-08-01' >> "$GITHUB_OUTPUT"
            echo 'end=2026-08-24' >> "$GITHUB_OUTPUT"
            echo 'symbol=ALL' >> "$GITHUB_OUTPUT"
            echo 'dry_run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run V11 Replay
        run: |
          args=(--start "${{ steps.params.outputs.start }}" --end "${{ steps.params.outputs.end }}" --symbol "${{ steps.params.outputs.symbol }}")
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python replay_signal_history_v11.py "${args[@]}" | tee replay_v11.json

      - name: Validate replay JSON
        run: python -c "import json; d=json.load(open('replay_v11.json')); assert d.get('status') in ('completed','dry-run'), d; print('Replay status:', d['status'])"

      - name: Upload replay result
        uses: actions/upload-artifact@v4
        with:
          name: v11-replay-${{ steps.params.outputs.symbol }}-${{ steps.params.outputs.start }}-${{ steps.params.outputs.end }}
          path: replay_v11.json
          retention-days: 14
