name: E2 surgery once

on:
  push:
    branches: [production-v2]

jobs:
  e2-surgery:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply strict E2 directional-edge boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("production_v2/e2_brain.py")
          s = p.read_text()
          old1 = 'if up >= 5 and up - down >= 2:'
          old2 = 'elif down >= 5 and down - up >= 2:'
          new1 = 'if up >= 5 and up - down >= 3:'
          new2 = 'elif down >= 5 and down - up >= 3:'
          if old1 in s or old2 in s:
              s = s.replace(old1, new1).replace(old2, new2)
              p.write_text(s)
          else:
              if new1 not in s or new2 not in s:
                  raise SystemExit("E2 directional boundary source not found")
          PY
      - name: Run E2 boundary tests
        run: python -m pytest -q production_v2/test_e2_opportunity_boundary.py
      - name: Compile E2
        run: python -m py_compile production_v2/e2_brain.py production_v2/test_e2_opportunity_boundary.py
      - name: Commit production surgery
        run: |
          if git diff --quiet; then
            echo "E2 surgery already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_v2/e2_brain.py
          git commit -m "fix: harden E2 directional opportunity boundary"
          git push origin production-v2
