name: e4-v14-validation
on:
  pull_request:
    branches: [production-v2]
jobs:
  e4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_e4_brain.py
      - run: python -m compileall -q production_v2
