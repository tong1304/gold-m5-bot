name: E1 V16 Regression

on:
  push:
    branches: [production-v2]
    paths:
      - 'production_v2/e1_professional_core_v15.py'
      - 'production_v2/e1_professional_core_v14.py'
      - 'tests/test_e1_v16_structure_authority.py'
      - '.github/workflows/e1-v16-regression.yml'

jobs:
  e1-v16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile E1 V16
        run: python -m py_compile production_v2/e1_professional_core_v14.py production_v2/e1_professional_core_v15.py
      - name: Run E1 V16 regression
        run: python -m pytest -q tests/test_e1_v16_structure_authority.py
