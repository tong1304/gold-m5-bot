name: Production V2 Opportunity Promotion Regression

on:
  push:
    branches: [fix-opportunity-promotion-2026-09-05]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q tests/test_opportunity_promotion_regression.py
