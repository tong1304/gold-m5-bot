name: E2 opportunity boundary tests

on:
  push:
    branches: [production-v2]

jobs:
  e2-opportunity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run E2 opportunity boundary tests
        run: python -m pytest -q production_v2/test_e2_opportunity_boundary.py
      - name: Compile E2
        run: python -m py_compile production_v2/e2_brain.py production_v2/test_e2_opportunity_boundary.py
