name: E6 setup thesis promotion boundary

on:
  push:
    branches: [production-v2]

jobs:
  promote-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v2
          fetch-depth: 0

      - name: Patch E6 promotion boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('production_v2/bootstrap_surgery.py')
          text = path.read_text()
          start = text.index('def _promote_independent_e6(')
          end = text.index('\ndef _bootstrap_e8_result', start)

          replacement = '''def _promote_independent_e6(original, snapshot, upstream):
    """Promote only a fully evidenced E1-E5 opportunity into an E6 setup thesis.

    This boundary does not create a trade. E7 still owns closed-candle confirmation,
    E8 owns trade economics/risk, and E9 remains the final decision authority.
    """
    result = original(snapshot, upstream)
    if not isinstance(result, EngineResult):
        return result
    out = dict(result.output or {})

    def direction(value):
        text = _text(value)
        if text in {"BUY", "BULLISH", "UP", "LONG", "BUYERS", "TREND_UP"} or text.startswith(("BUY ", "BUY_", "BUY:")):
            return "BUY"
        if text in {"SELL", "BEARISH", "DOWN", "SHORT", "SELLERS", "TREND_DOWN"} or text.startswith(("SELL ", "SELL_", "SELL:")):
            return "SELL"
        return "NEUTRAL"

    def payload(key):
        value = upstream.get(key)
        return dict(value.output or {}) if value else {}

    e1, e2, e3, e4, e5 = (payload(key) for key in ("E1", "E2", "E3", "E4", "E5"))
    e1d = direction(e1.get("directional_pressure", e1.get("pressure")))
    e2d = direction(e2.get("direction", e2.get("opportunity_direction")))
    e3i = direction(e3.get("internal_state"))
    event = _text(e4.get("event", e4.get("finding")))
    event_direction = _event_direction(e4)
    auction_state = _text(e4.get("auction_state", e4.get("state")))
    terminal = auction_state in {"CONFIRMED", "TERMINALLY_CONFIRMED", "ACCEPTED", "REJECTED", "RECLAIMED"} or "TERMINAL" in auction_state

    e2_finding = _text(e2.get("finding", e2.get("state")))
    e2_missing = {_text(x) for x in (e2.get("missing_evidence") or e2.get("missing_proof") or [])}
    e2_blockers = {_text(x) for x in (e2.get("blockers") or e2.get("reason_codes") or e2.get("reasons") or [])}
    e2_confirmation = (
        "CONFIRMED" in e2_finding
        and "NOT_PROVEN" not in e2_finding
        and "PENDING" not in e2_finding
        and not any("ACCEPTANCE" in x and "NOT_PROVEN" in x for x in e2_blockers)
        and not any("FOLLOW-THROUGH" in x or "FOLLOW_THROUGH" in x for x in e2_missing)
    )

    invalid = bool(e3.get("structure_invalidated") is True or e3.get("active_invalidation") is True or _text(e3.get("lifecycle")) == "INVALIDATED")
    protected_complete = _text(e3.get("protected_completeness")) == "COMPLETE"
    internal_aligned = e3i in {"BUY", "SELL"} and e3i == e1d

    preferred = _text(e5.get("preferred_location"))
    preferred_direction = "BUY" if preferred == "LONG" else "SELL" if preferred == "SHORT" else "NEUTRAL"
    value_state = _text(e5.get("value_state"))
    finding5 = _text(e5.get("finding"))
    structural_location = _text(e5.get("structural_location"))
    favorable_value = (e1d == "BUY" and value_state in {"DISCOUNT", "EQUILIBRIUM"}) or (e1d == "SELL" and value_state in {"PREMIUM", "EQUILIBRIUM"})
    favorable_location = "FAVORABLE_LOCATION" in finding5 or structural_location in {"AT_SUPPORT", "AT_RESISTANCE"} or favorable_value
    location_aligned = preferred_direction == "NEUTRAL" or preferred_direction == e1d
    space_key = "available_space_atr_long" if e1d == "BUY" else "available_space_atr_short"
    try:
        space = float(e5.get(space_key) or 0.0)
    except (TypeError, ValueError):
        space = 0.0
    space_ok = space >= 0.75

    event_valid = any(token in event for token in _MEANINGFUL_EVENTS)
    no_hard_conflict = not any("HARD_VETO" in _text(x) for x in (e5.get("reason_codes") or e5.get("reasons") or []))
    gate = (
        not invalid
        and e1d in {"BUY", "SELL"}
        and e2d == e1d
        and e2_confirmation
        and e3i == e1d
        and protected_complete
        and event_valid
        and event_direction == e1d
        and terminal
        and favorable_location
        and location_aligned
        and space_ok
        and no_hard_conflict
    )
    if not gate:
        return result

    event_id = str(e4.get("event_id") or e4.get("event_candle_id") or out.get("event_id") or "")
    setup = "LIQUIDITY_RESPONSE"
    support = list(dict.fromkeys([
        "E1_DIRECTIONAL_CORE",
        "E2_OPPORTUNITY_CONFIRMATION",
        "E3_INTERNAL_STRUCTURE_ALIGNMENT",
        "E4_CONFIRMED_RESPONSE",
        "E5_FAVORABLE_LOCATION",
        "E5_ADEQUATE_SPACE",
    ]))
    out.update({
        "state": "SETUP_THESIS",
        "setup_state": "SETUP_THESIS",
        "opportunity_stage": "SETUP_THESIS",
        "setup": setup,
        "setup_family": setup,
        "candidate_type": "SETUP_CANDIDATE",
        "candidate_setup": setup,
        "direction": e1d,
        "direction_thesis": e1d,
        "thesis_direction": e1d,
        "thesis_status": "FORMING",
        "setup_exists": True,
        "watch_only": False,
        "trade_ready": False,
        "trade_permission": False,
        "gate_passed": False,
        "e6_causal_gate": "PASSED",
        "e6_thesis_proven": True,
        "finding": f"{e1d} causal setup thesis is established from fully evidenced closed-candle E1-E5 conditions; E7 confirmation and E8 economics remain mandatory.",
        "thesis": f"{e1d} {setup} setup thesis is supported by directional core, confirmed opportunity, aligned structure, confirmed auction response, favorable location, and adequate space.",
        "supporting_evidence": support,
        "counter_evidence": [],
        "hard_conflicts": [],
        "missing_proof": ["E7_CONFIRMATION"],
        "missing_evidence": ["E7_CONFIRMATION"],
        "next_required_event": "E7_CONFIRMATION",
        "wait_for": "E7_CONFIRMATION",
        "reason_codes": ["E7_CONFIRMATION"],
        "reasons": ["E7_CONFIRMATION"],
        "event_id": event_id,
        "opportunity_id": f"{e1d}|SETUP_THESIS|{event_id}" if event_id else f"{e1d}|SETUP_THESIS",
        "available_space_atr": round(space, 4),
        "execution_authority": "E9",
        "invalidated": False,
        "upstream_evidence_lost": False,
        "causal_evidence_lost": False,
        "lifecycle_state": "SETUP_THESIS",
        "promotion_authority": "E1_E2_E3_E4_E5_STRICT_GATE",
        "promotion_version": "E6_SETUP_THESIS_PROMOTION_V1",
    })
    print(f"[PRODUCTION V2] E6_SETUP_THESIS_PROMOTION version=E6_SETUP_THESIS_PROMOTION_V1 direction={e1d} event_id={event_id} space_atr={space:.4f}", flush=True)
    return EngineResult(result.engine_id, result.name, False, result.score, out, ("E7_CONFIRMATION",))
'''
          path.write_text(text[:start] + replacement + text[end:])
          print('patched', path)
          PY

      - name: Run focused E6 promotion tests
        run: |
          python -m pytest -q production_v2/test_e6_setup_thesis_promotion.py

      - name: Syntax and diff validation
        run: |
          python -m py_compile production_v2/bootstrap_surgery.py production_v2/test_e6_setup_thesis_promotion.py
          git diff --check
          git diff -- production_v2/bootstrap_surgery.py

      - name: Commit production surgery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production_v2/bootstrap_surgery.py
          git commit -m 'fix: promote E6 only after complete setup thesis evidence'
          git push origin production-v2
