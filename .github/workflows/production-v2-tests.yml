name: production-v2-tests
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pytest -q tests/test_production_v2_sub_engines.py
