name: production-v2-tests
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [main]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest flask requests
      - name: Run production-v2 tests
        run: python -m pytest -q tests/test_production_v2_sub_engines.py tests/test_production_v2_runtime.py tests/test_production_v2_telegram.py tests/test_production_v2_professional_gates.py tests/test_production_v2_startup.py tests/test_production_v2_wait_state.py tests/test_production_v2_professional_wait_policy.py
