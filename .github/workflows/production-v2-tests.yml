name: production-v2-native-tests
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [main]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Compile production-v2
        run: python -m compileall -q production_v2
      - name: Run parallel evidence architecture regression tests
        run: python -m pytest -q tests/test_parallel_evidence_exchange.py
