name: production-v2-native-tests
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [main]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Compile production-v2
        run: python -m compileall -q production_v2
      - name: Run E1 Professional Brain v2.1 tests
        run: python -m pytest -q tests/test_e1_brain_v21.py
      - name: Run parallel evidence architecture regression tests
        run: python -m pytest -q tests/test_parallel_evidence_exchange.py
      - name: Run professional E9 reasoning regression tests
        run: python -m pytest -q tests/test_professional_e9.py
      - name: Run E8 trade-plan boundary regression test
        run: python -m pytest -q tests/test_e8_engine_boundary.py
      - name: Run E9 execution-readiness regression tests
        run: python -m pytest -q tests/test_e9_execution_readiness.py
