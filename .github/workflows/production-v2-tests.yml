name: production-v2-native-tests
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [main, production-v2]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Compile production-v2
        run: python -m compileall -q production_v2
      - name: Run E6 runtime watch semantics regression tests
        run: python -m pytest -q tests/test_e6_runtime_watch_semantics.py
      - name: Run concrete E6 thesis boundary regression tests
        run: python -m pytest -q tests/test_e7_concrete_setup_boundary.py
      - name: Run E6 lifecycle authority regression tests
        run: python -m pytest -q tests/test_e6_lifecycle_authority.py
      - name: Run causal reconciliation regression tests
        run: python -m pytest -q tests/test_causal_reconciliation.py
      - name: Run opportunity lifecycle regression tests
        run: python -m pytest -q tests/test_opportunity_lifecycle.py
      - name: Run shared market picture contract tests
        run: python -m pytest -q tests/test_shared_market_picture_contract.py
      - name: Run E6 directional consistency regression tests
        run: python -m pytest -q production_v2/test_e6_direction_consistency.py
      - name: Run nine-brain surgery boundary regression tests
        run: python -m pytest -q production_v2/tests/test_nine_brain_surgery.py
      - name: Run E1 v11 professional arbitration tests
        run: python -m pytest -q tests/test_e1_professional_v11.py
      - name: Run single-brain architecture contract tests
        run: python -m pytest -q production_v2/tests/test_single_brain_architecture.py
      - name: Run E1 Professional Test Matrix
        run: python -m pytest -q tests/test_e1_professional_test_matrix.py
      - name: Run E1 Professional Brain v2.1 tests
        run: python -m pytest -q tests/test_e1_brain_v21.py
      - name: Run E1 Professional Brain regression tests
        run: python -m pytest -q tests/test_e1_professional_brain.py
      - name: Run E1 long-horizon reconciliation regression tests
        run: python -m pytest -q tests/test_e1_long_horizon_reconciliation.py
      - name: Run E2 Professional Brain regression tests
        run: python -m pytest -q production_v2/test_e2_brain.py
      - name: Run E2 core-only professional contract tests
        run: python -m pytest -q tests/test_e2_core_only.py
      - name: Run E3 single professional brain regression tests
        run: python -m pytest -q tests/test_e3_single_brain.py
      - name: Run E4 Professional Liquidity & Auction Brain regression tests
        run: python -m pytest -q tests/test_e4_professional_brain.py
      - name: Run E4 Professional Liquidity & Auction Brain v18 contract tests
        run: python -m pytest -q tests/test_e4_professional_v18.py
      - name: Run E6-E7 professional flow regression tests
        run: python -m pytest -q tests/test_e6_e7_professional_flow.py
      - name: Run parallel evidence architecture regression tests
        run: python -m pytest -q tests/test_parallel_evidence_exchange.py
      - name: Run professional E9 reasoning regression tests
        run: python -m pytest -q tests/test_professional_e9.py
      - name: Run E8 trade-plan boundary regression test
        run: python -m pytest -q tests/test_e8_engine_boundary.py
      - name: Run E9 execution-readiness regression tests
        run: python -m pytest -q tests/test_e9_execution_readiness.py