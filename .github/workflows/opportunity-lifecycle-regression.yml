name: opportunity-lifecycle-regression
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [production-v2]

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production_v2
        run: python -m compileall -q production_v2
      - name: Run full opportunity lifecycle regression
        run: python -m pytest -q production_v2/test_opportunity_lifecycle.py production_v2/tests/test_opportunity_lifecycle_event_identity.py production_v2/tests/test_opportunity_lifecycle_evidence_gap.py production_v2/tests/test_e4_opportunity_anchor.py
