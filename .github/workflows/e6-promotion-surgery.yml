name: E6 promotion surgery
on:
  push:
    branches: [production-v2]

jobs:
  patch-and-test:
    if: contains(github.event.head_commit.message, 'test: define E6 watch to setup promotion gate')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v2
      - name: Patch E6 promotion boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('production_v2/e6_pending_event_surgery.py')
          s = p.read_text()
          marker = '\ndef _generic_candidate(upstream: dict[str, EngineResult]) -> dict[str, Any] | None:\n'
          insert = '''\n\ndef _e2_confirmed(e2: dict[str, Any], direction: str) -> bool:\n    maturity = _text(e2.get("opportunity_maturity") or e2.get("state") or e2.get("opportunity_state"))\n    finding = _text(e2.get("finding"))\n    e2_direction = _first_direction(e2.get("direction"), e2.get("opportunity_direction"), e2.get("auction_direction"))\n    confirmed = maturity in {"CONFIRMED", "MATURE", "VALIDATED", "TRADE_READY"} or "OPPORTUNITY CONFIRMED" in finding or "OPPORTUNITY IS CONFIRMED" in finding\n    return confirmed and e2_direction == direction\n\n\ndef _e4_followthrough_confirmed(e4: dict[str, Any]) -> bool:\n    state = _text(e4.get("auction_state") or e4.get("auction_phase") or e4.get("state"))\n    explicit = e4.get("follow_through") is True or e4.get("followthrough") is True or e4.get("follow_through_confirmed") is True\n    return state in {"CONFIRMED", "TERMINALLY_CONFIRMED", "ACCEPTED", "REJECTED", "RECLAIMED"} or explicit\n\n\ndef _promotion_ready(candidate: dict[str, Any]) -> bool:\n    missing = set(candidate.get("missing") or [])\n    blockers = {"E2_OPPORTUNITY_CONFIRMATION", "E4_AUCTION_FOLLOW_THROUGH", "E3_INTERNAL_STRUCTURE_ALIGNMENT", "STRUCTURAL_SPACE_INSUFFICIENT", "E5_DIRECTIONAL_LOCATION_CONFLICT"}\n    if missing & blockers or candidate.get("space", 0.0) < MIN_SPACE_ATR:\n        return False\n    required_support = {"E1_DIRECTIONAL_CORE", "E2_DIRECTIONAL_ANCHOR", "E3_INTERNAL_STRUCTURE_ALIGNMENT", "E4_CONFIRMED_RESPONSE"}\n    return required_support.issubset(set(candidate.get("support") or [])) and not candidate.get("counter")\n\n\ndef _setup_thesis(original: EngineResult, candidate: dict[str, Any]) -> EngineResult:\n    out = dict(original.output or {})\n    direction = candidate["direction"]\n    event_id = candidate.get("event_id") or ""\n    support = list(dict.fromkeys(candidate.get("support") or []))\n    if "E3_INTERNAL_STRUCTURE_ALIGNMENT" not in support:\n        support.append("E3_INTERNAL_STRUCTURE_ALIGNMENT")\n    if "E4_CONFIRMED_RESPONSE" not in support:\n        support.append("E4_CONFIRMED_RESPONSE")\n    out.update({\n        "architecture": VERSION, "state": "SETUP_THESIS", "setup_state": "SETUP_THESIS", "opportunity_stage": "SETUP_THESIS",\n        "setup": candidate["family"], "setup_family": candidate["family"], "candidate_type": "SETUP_CANDIDATE",\n        "direction": direction, "direction_thesis": direction, "thesis_direction": direction, "thesis_status": "FORMING",\n        "setup_exists": True, "watch_only": False, "trade_ready": False, "trade_permission": False, "gate_passed": False,\n        "finding": f"{direction} causal setup thesis is established from complete closed-candle E1-E5 evidence; E7 confirmation and E8 economics remain pending.",\n        "thesis": f"{direction} setup thesis: {candidate['family']} supported by complete closed-candle upstream evidence.",\n        "supporting_evidence": support, "counter_evidence": [], "hard_conflicts": [],\n        "missing_proof": ["E7_CONFIRMATION"], "missing_evidence": ["E7_CONFIRMATION"], "next_required_event": "E7_CONFIRMATION", "wait_for": "E7_CONFIRMATION",\n        "candidate_identity": f"SETUP_THESIS:{direction}:{candidate['family']}:{event_id}", "opportunity_id": f"{direction}|SETUP_THESIS|{event_id}" if event_id else f"{direction}|SETUP_THESIS",\n        "event_id": event_id, "available_space_atr": candidate["space"], "reason_codes": ["E7_CONFIRMATION"], "reasons": ["E7_CONFIRMATION"],\n        "execution_authority": "E9", "e6_causal_gate": "PASSED", "e6_thesis_proven": True, "invalidated": False,\n        "upstream_evidence_lost": False, "causal_evidence_lost": False, "lifecycle_state": "SETUP_THESIS", "promotion_authority": "E6_COMPLETE_UPSTREAM_EVIDENCE",\n    })\n    return EngineResult("E6", "Setup Brain", False, 0.0, out, ("E7_CONFIRMATION",))\n'''
          if '_promotion_ready(' not in s:
              s = s.replace(marker, insert + marker)
          s = s.replace('counter: list[str] = ["E4_PENDING_AUCTION_EVENT"]', 'e4_confirmed = _e4_followthrough_confirmed(e4)\n    counter: list[str] = [] if e4_confirmed else ["E4_PENDING_AUCTION_EVENT"]')
          s = s.replace('if _text(e4.get("auction_state")) in PENDING_AUCTION_STATES:\n        counter.append("E4_AUCTION_UNCONFIRMED")\n    else:\n        support.append("E4_CONFIRMED_RESPONSE")\n    missing = ["E4_AUCTION_FOLLOW_THROUGH", "E7_CONFIRMATION"]', 'if e4_confirmed:\n        support.append("E4_CONFIRMED_RESPONSE")\n    else:\n        counter.append("E4_AUCTION_UNCONFIRMED")\n    missing = ["E7_CONFIRMATION"]\n    if not e4_confirmed:\n        missing.insert(0, "E4_AUCTION_FOLLOW_THROUGH")')
          old = '''        current = _out(result)\n        if _is_existing_watch(current) or not _is_no_setup(current):\n            return _canonicalize_watch_evidence(_normalize_space_consistency(result, upstream), upstream)\n        candidate = _candidate(upstream)\n'''
          new = '''        current = _out(result)\n        normalized = _canonicalize_watch_evidence(_normalize_space_consistency(result, upstream), upstream)\n        candidate = _candidate(upstream)\n        if _is_existing_watch(current) and candidate is not None and _promotion_ready(candidate):\n            print(f"[PRODUCTION V2] E6_PENDING_EVENT_SURGERY version={VERSION} action=PROMOTE_SETUP_THESIS direction={candidate['direction']} event_id={candidate['event_id']}", flush=True)\n            return _setup_thesis(normalized, candidate)\n        if _is_existing_watch(current) or not _is_no_setup(current):\n            return normalized\n'''
          if old not in s:
              raise SystemExit('install marker not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Run E6 promotion tests
        run: |
          python -m pip install -q pytest
          pytest -q production_v2/test_e6_promotion_path.py production_v2/test_e6_evidence_authority.py
      - name: Commit surgery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production_v2/e6_pending_event_surgery.py
          git commit -m 'fix: prove E6 watch to setup promotion path'
          git push origin production-v2
