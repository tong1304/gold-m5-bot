name: E6 causal thesis validation

on:
  push:
    branches: [production-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PRODUCTION_V2_DISABLE_LIVE=1 PYTHONPATH=. pytest -q tests/test_e6_causal_thesis_btc_regression.py tests/test_e6_pending_counterflow_inference.py tests/test_e6_runtime_binding.py tests/test_e6_bootstrap_watch_boundary.py tests/test_e6_production_log_watch_regression.py tests/test_e6_opportunity_guard_high_acceptance.py tests/test_e6_gold_0850_pending_watch.py tests/test_e6_runtime_authority_semantics.py tests/test_e8_applicability_boundary.py tests/test_opportunity_lifecycle_e6_watch_boundary.py tests/test_three_boundary_surgeries.py tests/test_e6_runtime_chain_regression.py production_v2/tests/test_e6_runtime_thesis_contract.py production_v2/tests/test_e6_setup_lifecycle_contract.py
