name: wait-state-targeted-test
on:
  push:
    branches: [feature/professional-wait-state]

jobs:
  wait-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest flask requests
      - run: python -m pytest -q tests/test_production_v2_wait_state.py
