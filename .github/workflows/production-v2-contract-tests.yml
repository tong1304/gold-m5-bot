name: Production V2 Decision Contract Tests
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [main, production-v2]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  decision-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Production V2 runtime modules
        run: python -m py_compile production_v2/contracts.py production_v2/service.py
      - name: Run decision and trace contract tests
        run: python -m pytest -q tests/test_production_v2_decision_contract.py tests/test_production_v2_trace_state.py
