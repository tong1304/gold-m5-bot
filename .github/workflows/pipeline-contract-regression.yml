name: pipeline-contract-regression
on:
  push:
    branches: [production-v2]
  pull_request:
    branches: [production-v2]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Compile production-v2
        run: python -m compileall -q production_v2
      - name: Run pipeline contract regression
        run: python -m pytest -q tests/test_pipeline_contract_regression.py
