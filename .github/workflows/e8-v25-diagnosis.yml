name: e8-v25-diagnosis
on:
  push:
    branches: [production-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Compile production-v2 E8
        run: python -m compileall -q production_v2/e8_brain.py production_v2/contracts.py
      - name: Run E8 v25 diagnosis tests
        run: python -m pytest -q tests/test_e8_v25_economic_diagnosis.py
