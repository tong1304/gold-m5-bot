name: Shared Market Consistency Tests

on:
  push:
    branches: [surgery/shared-market-consistency-v1]
    paths:
      - 'production_v2/shared_market_picture.py'
      - 'tests/test_shared_market_consistency.py'
  workflow_dispatch:

jobs:
  shared-market-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile production_v2/shared_market_picture.py
      - run: PYTHONPATH=. pytest -q tests/test_shared_market_consistency.py
