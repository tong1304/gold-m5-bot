name: E3 Surgery V51 CI

on:
  push:
    branches: [e3-professional-surgery-v51]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile production_v2/e3_brain.py
      - run: python -m pytest -q production_v2/test_e3_brain.py tests/test_e3_professional_structure.py
