name: Multi-Strategy Tests

on:
  push:
    branches: [main, v11-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: multi-strategy-v11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run V11 regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_v11_hardening.py tests/test_v11_contracts.py tests/test_multi_strategy.py tests/test_replay_performance.py tests/test_v12_regime_engine_rules.py tests/test_asset_strategy_architecture.py
