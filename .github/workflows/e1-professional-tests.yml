name: E1 Professional Brain Tests

on:
  push:
    branches: [production-v2]
    paths:
      - 'production_v2/e1_brain.py'
      - 'production_v2/e1_professional_layer.py'
      - 'production_v2/e1_professional_layer_v4.py'
      - 'production_v2/e1_professional_layer_v5.py'
      - 'production_v2/e1_professional_layer_v6.py'
      - 'production_v2/e1_professional_layer_v7.py'
      - 'production_v2/e1_professional_layer_v8.py'
      - 'production_v2/e1_professional_layer_v9.py'
      - 'production_v2/e1_professional_layer_v10.py'
      - 'production_v2/pipeline.py'
      - 'tests/test_e1_professional_v10.py'
      - 'tests/test_e1_professional_reasoning.py'
      - 'tests/test_e1_professional_v5.py'
      - 'tests/test_e1_professional_v7.py'
      - 'tests/test_e1_brain_v21.py'
      - '.github/workflows/e1-professional-tests.yml'

jobs:
  e1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile E1
        run: |
          python -m py_compile production_v2/e1_brain.py
          python -m py_compile production_v2/e1_professional_layer.py
          python -m py_compile production_v2/e1_professional_layer_v4.py
          python -m py_compile production_v2/e1_professional_layer_v5.py
          python -m py_compile production_v2/e1_professional_layer_v6.py
          python -m py_compile production_v2/e1_professional_layer_v7.py
          python -m py_compile production_v2/e1_professional_layer_v8.py
          python -m py_compile production_v2/e1_professional_layer_v9.py
          python -m py_compile production_v2/e1_professional_layer_v10.py
          python -m py_compile production_v2/pipeline.py
      - name: Run E1 professional tests
        run: |
          python -m pytest -q tests/test_e1_professional_v10.py
          python -m pytest -q tests/test_e1_professional_reasoning.py
          python -m pytest -q production_v2/tests/test_e1_professional_reconciliation_v2.py
          python -m pytest -q tests/test_e1_professional_v5.py
          python -m pytest -q production_v2/tests/test_e1_professional_v6.py
          python -m pytest -q tests/test_e1_professional_v7.py