name: e4-v12-regression
on:
  pull_request:
    branches: [main, production-v2]
  push:
    branches: [e4-professional-brain-v12]

env:
  PRODUCTION_V2_DISABLE_LIVE: "1"

jobs:
  e4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy flask requests lse-data
      - name: Compile E4
        run: python -m py_compile production_v2/e4_brain.py
      - name: Run E4 Professional Brain regression tests
        run: python -m pytest -q tests/test_e4_professional.py
